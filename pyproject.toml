[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-stt-plugin-nemo"
dynamic = ["version"]
description = "A nemo stt plugin for OVOS"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
keywords = ["ovos", "plugin", "stt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    "ovos-utils>=0.8.4,<1.0.0",
    "huggingface_hub>=0.23.2",
    "nemo_toolkit[all]>=2.2.0",
]

[project.optional-dependencies]
test = [
    "ovoscope>=0.19.0a1,<1.0.0",
    "ovos-dinkum-listener",
    "pytest<10",
    "pytest-timeout>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-stt-plugin-nemo"

[project.entry-points."opm.stt"]
"ovos-stt-plugin-nemo" = "ovos_stt_plugin_nemo:NemoSTT"

[tool.setuptools.dynamic]
version = { attr = "ovos_stt_plugin_nemo.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_stt_plugin_nemo*"]

[tool.setuptools.package-data]
ovos_stt_plugin_nemo = ["*.json", "locale/**/*"]
